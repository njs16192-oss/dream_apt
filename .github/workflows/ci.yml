# 백엔드·프론트 검사 (docs/adr/009-ci.md)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. main push는 취소하지 않는다 (연달아 머지해도 커밋마다 결과가 남게)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle 캐시 + gradle-wrapper.jar 체크섬 검증
      - uses: gradle/actions/setup-gradle@v6
      # 통합 테스트는 Testcontainers가 러너의 Docker로 postgis 컨테이너를 띄운다
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # chunk 크기 경고(500 kB)는 실패로 보지 않는다. 코드 분할은 배포 때 검토
      - run: npm run build
